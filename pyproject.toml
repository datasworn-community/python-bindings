[project]
name = "datasworn-community-python-bindings"
version = "0.1.0"
description = "Pydantic v2 models for Datasworn — Ironsworn / Starforged / expansions."
readme = "README.md"
requires-python = ">=3.14"
# The root project doesn't publish; the single workspace member `core` does.

[tool.uv]
managed = true
package = false  # virtual workspace root

[tool.uv.workspace]
members = ["packages/core"]

[tool.uv.sources]
datasworn-community-core = { workspace = true }

[dependency-groups]
dev = [
    "datasworn-community-core",
    "pytest>=9.1.1",
]
